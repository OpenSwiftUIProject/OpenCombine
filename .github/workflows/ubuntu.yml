name: Ubuntu 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu_test:
    name: Execute tests on Ubuntu
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift_image: "5.9.2-jammy"   # Swift 5.9.2 (minimum supported)
          - swift_image: "6.1-noble"     # Current Swift
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Building and running tests in debug mode with coverage
        run: |
          swift test \
            -c debug \
            -Xswiftc -warnings-as-errors \
            --enable-code-coverage \
            --build-path .build-test-debug
          llvm-cov show \
            -instr-profile=.build-test-debug/debug/codecov/default.profdata \
            .build-test-debug/debug/OpenCombinePackageTests.xctest \
            > coverage.txt
      - name: Building and running tests in debug mode with TSan
        run: |
          swift test \
            -c debug \
            --sanitize thread \
            --build-path .build-test-debug-sanitize-thread
      - name: Building and running tests in release mode
        run: |
          swift test \
            -c release \
            -Xswiftc -warnings-as-errors \
            --build-path .build-test-release
      - uses: codecov/codecov-action@v4
        with:
          verbose: true
