name: macOS 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos_test:
    name: Execute tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode-version: "15.2"   # Swift 5.9.2 (minimum supported)
            # TODO: drop this once the Swift 6 Sendable/Concurrency warnings
            # in the schedulers and test doubles are resolved.
            warnings-as-errors: "-Xswiftc -warnings-as-errors"
          - os: macos-15
            xcode-version: "16.4"   # Current Swift
            warnings-as-errors: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: OpenSwiftUIProject/setup-xcode@v2
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Swift version
        run: swift --version
      - name: Build and run tests in debug mode with coverage
        run: |
          swift test \
            -c debug \
            ${{ matrix.warnings-as-errors }} \
            --enable-code-coverage \
            --build-path .build-test-debug
          xcrun llvm-cov show \
            -instr-profile=.build-test-debug/debug/codecov/default.profdata \
            .build-test-debug/debug/OpenCombinePackageTests.xctest/Contents/MacOS/OpenCombinePackageTests \
            > coverage.txt
      - name: Build and run tests in debug mode with TSan
        run: |
          swift test \
          -c debug \
          --sanitize thread \
          ${{ matrix.warnings-as-errors }} \
          --build-path .build-test-debug-sanitize-thread
      - name: Build and run tests in release mode
        run: |
          swift test \
            -c release \
            ${{ matrix.warnings-as-errors }} \
            --enable-code-coverage \
            --build-path .build-test-release
      - uses: codecov/codecov-action@v4
        with:
          verbose: true
